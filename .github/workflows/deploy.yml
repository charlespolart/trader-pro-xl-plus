name: Deploy Backend

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to deploy (latest = HEAD short SHA, or pass a 7-char SHA to roll back)"
        required: false
        default: latest

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      image_name: ${{ steps.meta.outputs.image_name }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ "${{ github.event.inputs.tag }}" = "latest" ]; then
            echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi
          owner_lc="${OWNER,,}"   # GHCR requires lowercase
          echo "image_name=ghcr.io/${owner_lc}/trader-pro-xl-plus-backend" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          target: runtime
          push: true
          tags: |
            ${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image_name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Sync compose + Caddyfile (never source code)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy "$VPS_USER@$VPS_HOST" 'mkdir -p /srv/tpx/ops'
          rsync -az -e 'ssh -i ~/.ssh/id_deploy' \
            ops/docker-compose.yml \
            ops/docker-compose.prod.yml \
            "$VPS_USER@$VPS_HOST:/srv/tpx/ops/"
          # Caddy bind-mount captures the inode → overwrite in place.
          scp -i ~/.ssh/id_deploy ops/Caddyfile "$VPS_USER@$VPS_HOST:/tmp/tpx-Caddyfile"
          ssh -i ~/.ssh/id_deploy "$VPS_USER@$VPS_HOST" \
            'cat /tmp/tpx-Caddyfile > /srv/tpx/ops/Caddyfile && rm /tmp/tpx-Caddyfile'

      - name: Pull image, migrate, restart backend
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          ssh -i ~/.ssh/id_deploy "$VPS_USER@$VPS_HOST" \
            "IMAGE_TAG='$IMAGE_TAG' bash -s" << 'REMOTE'
          set -euo pipefail
          cd /srv/tpx
          echo "$IMAGE_TAG" > .deployed-tag

          COMPOSE="docker compose --env-file /srv/tpx/.env \
            -f ops/docker-compose.yml \
            -f ops/docker-compose.prod.yml"

          $COMPOSE pull backend
          $COMPOSE up -d --wait postgres

          for attempt in 1 2 3; do
            if $COMPOSE run --rm --no-deps -T backend bun run --cwd packages/db migrate:ci </dev/null; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then echo "migrate failed 3×, aborting"; exit 1; fi
            sleep 5
          done

          $COMPOSE up -d --wait

          $COMPOSE exec -T caddy caddy validate --config /etc/caddy/Caddyfile
          $COMPOSE exec -T caddy caddy reload --config /etc/caddy/Caddyfile

          docker image prune -f
          REMOTE
