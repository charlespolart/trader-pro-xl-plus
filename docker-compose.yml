services:
  postgres:
    image: postgres:17-alpine
    container_name: tpx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tpx
      POSTGRES_PASSWORD: tpx
      POSTGRES_DB: tpx
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tpx"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
