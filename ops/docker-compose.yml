name: tpx

# Env-neutral BASE. Not runnable on its own (backend has no image/build) —
# always layer an overlay:
#   dev  : docker compose -f ops/docker-compose.yml -f ops/docker-compose.dev.yml ...
#   prod : docker compose -f ops/docker-compose.yml -f ops/docker-compose.prod.yml ...
# Overlays only ever ADD (compose appends ports/volumes/env_file on merge).

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tpx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tpx}
      POSTGRES_DB: ${POSTGRES_DB:-tpx}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tpx} -d ${POSTGRES_DB:-tpx}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  backend:
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3001
      DATABASE_URL: postgres://${POSTGRES_USER:-tpx}:${POSTGRES_PASSWORD:-tpx}@postgres:5432/${POSTGRES_DB:-tpx}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
