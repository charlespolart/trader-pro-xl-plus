# DEV overlay — loopback-only ports + named pg volume + (optional) backend
# container with hot reload. You can also keep running the backend natively
# (`make back`) against the dockerized Postgres (`make db`); the backend
# service here is only used if you `docker compose ... up backend`.
services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5436}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ..
      dockerfile: apps/backend/Dockerfile
      target: development
    environment:
      NODE_ENV: development
    env_file:
      - ../apps/backend/.env
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - ../packages:/app/packages:delegated
      - ../apps/backend/src:/app/apps/backend/src:delegated
      - ../strategies:/app/strategies:delegated

volumes:
  pgdata:
    # 2026-07-15 : volume v2 = données RÉPARÉES après la corruption WAL du
    # crash disque-plein (pg_resetwal sur copie, intégrité vérifiée — audit1).
    # L'ancien volume `trader-pro-xl-plus_pgdata` est conservé tel quel
    # (corrompu) en pièce forensic ; snapshot froid dans ~/pg-snapshots/.
    name: tpx-pgdata-v2
